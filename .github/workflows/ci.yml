# Tiers 1 and 2 of the CI policy: both run on every pull request.
# Tier 2 presupposes Tier 1, so a merge is gated on the full suite.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tier 1 — correctness gate ────────────────────────────────────────
  # Linux + Windows, minimum and latest supported Python. macOS is left out
  # deliberately: Linux plus Windows covers the portability risks NFR-3
  # identifies, and macOS can be added if a platform-specific bug appears.
  correctness:
    name: tier1 (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Package imports cleanly
        run: python -c "import dart; print(dart.__version__, dart.DART.variants())"

      - name: Lint and format check
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Unit tests
        # Covers metric computation against hand-checked fixtures, the RepConv
        # fusion equivalence check, dataset ingestion for each supported
        # format, and the FR-1.7 validation errors.
        run: pytest tests -q -m "not slow"

      - name: One-epoch smoke run produces the expected artifacts
        run: python scripts/smoke_train.py

  # ── Tier 2 — reproducibility gate ────────────────────────────────────
  reproducibility:
    name: tier2 (reproducibility + export)
    runs-on: ubuntu-latest
    needs: correctness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Same seed and config produce identical metrics
        run: pytest tests/test_engine.py -q -k "same_seed or different_seeds"

      - name: ONNX export matches the PyTorch model
        run: pytest tests/test_export.py -q
